services:

    # The interface aliases below used to point at services nobody registered, which
    # made the container fail to compile. The bundle now declares them itself,
    # explicitly rather than through autowiring, as bundles should.

    Jul6Art\AuthBundle\Repository\UserRepository:
        arguments:
            - '@doctrine'
        tags:
            - { name: doctrine.repository_service }

    Jul6Art\AuthBundle\Manager\UserManager:
        calls:
            - setUserRepository: ['@Jul6Art\AuthBundle\Repository\Interfaces\UserRepositoryInterface']

    Jul6Art\AuthBundle\Manager\Interfaces\UserManagerInterface: '@Jul6Art\AuthBundle\Manager\UserManager'
    Jul6Art\AuthBundle\Repository\Interfaces\UserRepositoryInterface: '@Jul6Art\AuthBundle\Repository\UserRepository'
